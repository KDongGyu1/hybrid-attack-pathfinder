# hap-soc-api EC2용 nginx 설정. docker-compose 안에서 nginx 컨테이너가 이 파일을 그대로 사용.
# ALB(443, hap-soc.kro.kr) -> EC2:3000(nginx, SG에 열린 유일한 포트)
#   /api/* -> api 컨테이너(NestJS, 내부 4000)
#   그 외    -> web 컨테이너(Next.js, 내부 3001)
server {
    listen 3000;
    server_name hap-soc.kro.kr;

    location /api/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://web:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
