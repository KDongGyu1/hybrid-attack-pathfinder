# hap-soc-api EC2에서 실행하는 배포용 compose. nginx + NestJS(api) + Next.js(web) 3개 컨테이너.
# 실행: docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# .env.production은 저장소에 커밋하지 않는다 (JWT/DB 시크릿 포함) — hap-soc-api EC2에만 존재.
# 값을 채우는 방식(직접 작성 / Secrets Manager에서 스크립트로 생성 등)은 아직 인프라팀과 미확정.
# .env.production.example을 참고해서 실제 값으로 채운 .env.production을 서버에 만들어야 한다.

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: hap-soc-nginx
    ports:
      - "3000:3000"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web

  api:
    build:
      context: ./hybrid-attack-path-backend
    container_name: hap-soc-api-nestjs
    environment:
      PORT: 4000
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE:-hybrid_attack_path}
      DB_SSL: ${DB_SSL:-false}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-900s}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      GRAPH_ENGINE_BASE_URL: ${GRAPH_ENGINE_BASE_URL}
    expose:
      - "4000"

  web:
    build:
      context: ./hybrid-attack-path-frontend
    container_name: hap-soc-api-nextjs
    expose:
      - "3001"
