services:
  postgres:
    image: postgres:16
    container_name: hap-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hybrid_attack_path
    ports:
      - "5432:5432"
    volumes:
      - hap_pgdata:/var/lib/postgresql/data

volumes:
  hap_pgdata:
