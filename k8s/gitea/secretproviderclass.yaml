apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: gitea-db-secret
  namespace: prod
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "hap-db-secret"
        objectType: "secretsmanager"
  secretObjects:
    - secretName: gitea-db-credentials
      type: Opaque
      data:
        - objectName: "hap-db-secret"
          key: password
